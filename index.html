    <title>আল-হেরা মাদরাসা ম্যানেজমেন্ট সিস্টেম</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
    <script>
      // Global Safe JSON and Response Protection
      (function() {
        // Safe JSON.parse protection
        const originalJsonParse = JSON.parse;
        JSON.parse = function(text, reviver) {
          if (typeof text === 'string') {
            const trimmed = text.trim();
            if (trimmed.startsWith('<') || trimmed.toLowerCase().startsWith('<!doctype')) {
              console.warn("JSON.parse intercepted HTML doctype string. Returned safe fallback.");
              return {};
            }
          }
          try {
            return originalJsonParse(text, reviver);
          } catch (e) {
            if (typeof text === 'string' && (text.includes('<') || text.includes('doctype') || text.includes('html'))) {
              console.warn("JSON.parse avoided crash on HTML string:", e);
              return {};
            }
            throw e;
          }
        };

        // Safe Response.prototype.json protection
        if (typeof Response !== 'undefined' && Response.prototype) {
          const originalResponseJson = Response.prototype.json;
          Response.prototype.json = async function() {
            try {
              const contentType = this.headers && typeof this.headers.get === 'function' ? this.headers.get('content-type') : '';
              if (contentType && contentType.includes('text/html')) {
                console.warn("Response has text/html content-type, returning safe fallback object.");
                return {};
              }
              const text = await this.text();
              if (!text || !text.trim()) return {};
              const trimmed = text.trim();
              if (trimmed.startsWith('<') || trimmed.toLowerCase().startsWith('<!doctype')) {
                console.warn("API response was HTML (<...). Prevented JSON parse error.");
                return {};
              }
              return originalJsonParse(text);
            } catch (err) {
              console.warn("Safely intercepted Response.json error:", err);
              return {};
            }
          };
        }
      })();

      // Aggressively silence Vite WebSocket errors and unexpected doctype JSON errors
      (function() {
        const OriginalWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          if (typeof url === 'string' && (url.includes('vite') || url.includes('hmr'))) {
            // Return a dummy object that mimics a closed WebSocket
            return {
              addEventListener: () => {},
              removeEventListener: () => {},
              send: () => {},
              close: () => {},
              readyState: 3, // CLOSED
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
            };
          }
          try {
            return new OriginalWebSocket(url, protocols);
          } catch (e) {
            return {
              addEventListener: () => {},
              removeEventListener: () => {},
              send: () => {},
              close: () => {},
              readyState: 3,
            };
          }
        };
        window.WebSocket.prototype = OriginalWebSocket.prototype;
      })();

      // Silence unhandled rejections related to WebSockets and <!doctype JSON errors
      window.addEventListener('unhandledrejection', function(event) {
        const reason = event.reason;
        const msg = reason ? (reason.message || String(reason)) : '';
        if (
          msg.includes('WebSocket') ||
          msg.includes("Unexpected token '<'") ||
          msg.includes('<!doctype') ||
          msg.includes('is not valid JSON') ||
          (reason && reason.name === 'Error' && reason.message === 'WebSocket closed without opened')
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      // Silence window errors related to unexpected HTML JSON parse
      window.addEventListener('error', function(event) {
        const msg = event ? (event.message || String(event)) : '';
        if (
          msg.includes('WebSocket') ||
          msg.includes("Unexpected token '<'") ||
          msg.includes('<!doctype') ||
          msg.includes('is not valid JSON')
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      // Silence console errors and warnings related to Vite/WebSocket/JSON HTML
      const silencePatterns = [
        '[vite] failed to connect to websocket',
        'WebSocket closed without opened',
        'WebSocket connection failed',
        'hmr',
        "Unexpected token '<'",
        '<!doctype',
        'is not valid JSON'
      ];

      const originalError = console.error;
      console.error = (...args) => {
        if (args[0] && typeof args[0] === 'string' && silencePatterns.some(p => args[0].toLowerCase().includes(p.toLowerCase()))) {
          return;
        }
        originalError.apply(console, args);
      };

      const originalWarn = console.warn;
      console.warn = (...args) => {
        if (args[0] && typeof args[0] === 'string' && silencePatterns.some(p => args[0].toLowerCase().includes(p.toLowerCase()))) {
          return;
        }
        originalWarn.apply(console, args);
      };
    </script>
